# Render free-tier deploy for the FastAPI backend.
# Connect this repo in the Render dashboard; it auto-deploys on push to main.
services:
  - type: web
    name: ai-research-agent-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
